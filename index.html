<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự báo thời tiết</title>
    <link rel="stylesheet" href="./style/homework1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
</head>
<body>
    <div class="shadow-lg p-3 mb-5  border border-black rounded container" style="background: #B0DAFF;" id="weatherForecastContainer">
        <div id="weatherForecast1">
            <div class="container mb-3 d-flex " style="gap: 10px;" id="currentWeatherForecastContainer">
            <input class="form-control w-25" type="text" placeholder="Search for a city" id="cityweatherForecast" aria-label="default input example">
            <button type="button" class="btn border border-black bg-black text-light" id="btnSubmit">Search</button>
            <div id="icon"class="border border-black p-1 rounded">
                <i class="fa-solid fa-location-dot fa-xl"></i>
            </div>
            </div>
            
        </div>
        <div class="container" id="forecastDay" style="display: grid;grid-template-columns: auto auto auto auto auto;">
            <time datetime="10-12-2011 10-10"> </time>
        </div>
    </div>
    
</body>
</html>
<script src="./script/homework1.js"></script>
